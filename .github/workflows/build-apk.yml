name: Build My Bills APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'MyBills_update.zip'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mybills-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify permanent signing secrets
        shell: bash
        env:
          KEYSTORE_HEX: ${{ secrets.MYBILLS_KEYSTORE_HEX }}
          KEYSTORE_PASSWORD: ${{ secrets.MYBILLS_KEYSTORE_PASSWORD }}
        run: test -n "$KEYSTORE_HEX" && test -n "$KEYSTORE_PASSWORD"

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_HEX: ${{ secrets.MYBILLS_KEYSTORE_HEX }}
          KEYSTORE_PASSWORD: ${{ secrets.MYBILLS_KEYSTORE_PASSWORD }}
        run: printf '%s' "$KEYSTORE_HEX" | tr -d '[:space:]' | xxd -r -p > "$RUNNER_TEMP/mybills-release.jks" && test -s "$RUNNER_TEMP/mybills-release.jks" && keytool -list -keystore "$RUNNER_TEMP/mybills-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias mybills >/dev/null && echo "MYBILLS_KEYSTORE_FILE=$RUNNER_TEMP/mybills-release.jks" >> "$GITHUB_ENV" && echo "MYBILLS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build permanently signed APK
        run: gradle assembleRelease

      - name: Find release APK
        shell: bash
        run: APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"; test -n "$APK"; cp "$APK" MyBills.apk

      - name: Verify APK signature
        shell: bash
        run: APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"; test -n "$APKSIGNER"; "$APKSIGNER" verify --verbose MyBills.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MyBills-signed
          path: MyBills.apk
          if-no-files-found: error
