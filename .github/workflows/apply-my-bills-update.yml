name: Apply My Bills Update

on:
  push:
    paths:
      - 'MyBills_update.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mybills-apply-update-main
  cancel-in-progress: false

jobs:
  apply-update-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply uploaded My Bills package
        shell: bash
        run: |
          set -euo pipefail

          if [ -f MyBills_update.zip ]; then
            cp MyBills_update.zip /tmp/MyBills_update.zip
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/MyBills_update.zip MyBills_update.zip

            rm -rf .mybills_update_tmp
            mkdir .mybills_update_tmp
            unzip -o MyBills_update.zip -d .mybills_update_tmp

            DELETE_LIST=".mybills_update_tmp/.mybills-delete-list.txt"
            if [ -f "$DELETE_LIST" ]; then
              while IFS= read -r OLD_PATH || [ -n "$OLD_PATH" ]; do
                case "$OLD_PATH" in
                  ''|'#'*) continue ;;
                esac
                if [[ "$OLD_PATH" = /* || "$OLD_PATH" = *".."* ]]; then
                  echo "::error::Unsafe cleanup path: $OLD_PATH"
                  exit 1
                fi
                rm -rf -- "$OLD_PATH"
              done < "$DELETE_LIST"
              rm -f "$DELETE_LIST"
            fi

            cp -a .mybills_update_tmp/. .
            rm -rf .mybills_update_tmp
            rm -f MyBills_update.zip
          else
            echo "No MyBills_update.zip found; manual run will build current main."
          fi

      - name: Commit and push applied update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply My Bills app update"
            git fetch origin main
            if ! git push origin HEAD:main; then
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          else
            echo "No repository changes to commit."
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify permanent signing secrets
        shell: bash
        env:
          KEYSTORE_HEX: ${{ secrets.MYBILLS_KEYSTORE_HEX }}
          KEYSTORE_PASSWORD: ${{ secrets.MYBILLS_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_HEX" || { echo "::error::Missing MYBILLS_KEYSTORE_HEX"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing MYBILLS_KEYSTORE_PASSWORD"; exit 1; }

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_HEX: ${{ secrets.MYBILLS_KEYSTORE_HEX }}
          KEYSTORE_PASSWORD: ${{ secrets.MYBILLS_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/mybills-release.jks"
          printf '%s' "$KEYSTORE_HEX" | tr -d '[:space:]' | xxd -r -p > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias mybills >/dev/null
          echo "MYBILLS_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "MYBILLS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed APK and Play App Bundle
        run: gradle clean assembleRelease bundleRelease

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' | head -n 1)"
          test -n "$APK"
          test -n "$AAB"
          cp "$APK" MyBills.apk
          cp "$AAB" MyBills.aab

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose MyBills.apk

      - name: Verify App Bundle signature
        shell: bash
        run: |
          set -euo pipefail
          # Android release keys are normally self-signed. `jarsigner -strict`
          # treats that expected condition as a fatal PKIX error even when the
          # App Bundle is correctly signed. Verify the JAR signature without
          # strict CA-chain enforcement, then print the signing certificate.
          jarsigner -verify MyBills.aab
          keytool -printcert -jarfile MyBills.aab >/dev/null

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MyBills-signed-APK
          path: MyBills.apk
          if-no-files-found: error

      - name: Upload Play Store App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: MyBills-Play-AAB
          path: MyBills.aab
          if-no-files-found: error
