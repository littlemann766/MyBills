plugins { id 'com.android.application' }

def myBillsKeystoreFile = System.getenv('MYBILLS_KEYSTORE_FILE')
def myBillsKeystorePassword = System.getenv('MYBILLS_KEYSTORE_PASSWORD')

android {
    namespace 'com.mybills.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mybills.app'
        minSdk 26
        targetSdk 36
        versionCode 231
        versionName '20.5.16'
    }

    signingConfigs {
        release {
            if (myBillsKeystoreFile && myBillsKeystorePassword) {
                storeFile file(myBillsKeystoreFile)
                storePassword myBillsKeystorePassword
                keyAlias 'mybills'
                keyPassword myBillsKeystorePassword
            }
        }
    }

    buildTypes {
        debug {
            // Debug builds remain available for local troubleshooting only.
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies { }
